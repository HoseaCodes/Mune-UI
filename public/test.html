<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mun-e - AI-Driven Financial Sidekick</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['DM Sans', 'ui-sans-serif', 'system-ui']
                    },
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        .chat-bubble-enter {
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .gradient-mesh {
            background: linear-gradient(45deg, #10b981, #34d399, #6ee7b7);
            background-size: 400% 400%;
            animation: gradientShift 8s ease-in-out infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(3deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MuneLandingPage = () => {
            const [isVisible, setIsVisible] = useState({});

            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((entry) => {
                            if (entry.isIntersecting) {
                                setIsVisible(prev => ({
                                    ...prev,
                                    [entry.target.id]: true
                                }));
                            }
                        });
                    },
                    { threshold: 0.1 }
                );

                const elements = document.querySelectorAll('[data-animate]');
                elements.forEach(el => observer.observe(el));

                return () => observer.disconnect();
            }, []);

            const ChatBubble = ({ children, className = "", isUser = false }) => (
                <div className={`flex ${isUser ? 'justify-end' : 'justify-start'} mb-4`}>
                    <div className={`max-w-xs px-4 py-3 rounded-2xl text-sm chat-bubble-enter ${
                        isUser 
                            ? 'bg-emerald-500 text-white rounded-br-sm' 
                            : 'bg-gray-100 text-gray-800 rounded-bl-sm'
                    } ${className}`}>
                        {children}
                    </div>
                </div>
            );

            const FeatureCard = ({ icon, title, description, delay = 0 }) => (
                <div 
                    data-animate
                    className={`bg-white rounded-3xl p-8 shadow-sm hover:shadow-xl transition-all duration-500 border border-gray-100 ${
                        isVisible.features ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'
                    }`}
                    style={{ transitionDelay: `${delay}ms` }}
                    id="features"
                >
                    <div className="text-3xl mb-4">{icon}</div>
                    <h3 className="text-xl font-semibold text-gray-900 mb-3">{title}</h3>
                    <p className="text-gray-600 leading-relaxed">{description}</p>
                </div>
            );

            return (
                <div className="min-h-screen bg-gradient-to-b from-gray-50 to-white antialiased">
                    {/* Header */}
                    <header className="flex items-center justify-between px-6 lg:px-8 py-6 relative z-50">
                        <div className="flex items-center space-x-2">
                            <div className="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center">
                                <span className="text-white font-bold text-sm">M</span>
                            </div>
                            <span className="text-2xl font-bold text-gray-900">mun-e</span>
                        </div>
                        
                        <nav className="hidden md:flex items-center space-x-8">
                            <a href="#about" className="text-gray-700 hover:text-gray-900 font-medium transition-colors">
                                About us
                            </a>
                            <button className="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-200 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                                Get early access
                            </button>
                        </nav>

                        {/* Mobile menu button */}
                        <button className="md:hidden p-2">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                        </button>
                    </header>

                    {/* Hero Section */}
                    <section className="px-6 lg:px-8 pt-16 pb-24">
                        <div className="max-w-4xl mx-auto text-center">
                            <h1 
                                data-animate
                                className={`text-5xl lg:text-7xl font-bold leading-tight mb-6 ${
                                    isVisible.hero ? 'translate-y-0 opacity-100' : 'translate-y-12 opacity-0'
                                } transition-all duration-800`}
                                id="hero"
                            >
                                <span className="text-gray-900">The AI-Driven<br />Financial<br />Sidekick for a</span>
                                <br />
                                <span className="text-emerald-500 relative">
                                    New Generation
                                    <div className="absolute -inset-2 bg-emerald-50 rounded-2xl -z-10 transform rotate-1"></div>
                                </span>
                            </h1>
                            
                            <p 
                                data-animate
                                className={`text-xl text-gray-600 mb-8 max-w-2xl mx-auto ${
                                    isVisible.hero ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'
                                } transition-all duration-800 delay-200`}
                            >
                                Budgeting, saving, investing, and credit monitoring made easy.
                            </p>
                            
                            <button 
                                data-animate
                                className={`bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-4 rounded-xl text-lg font-semibold transition-all duration-200 shadow-lg hover:shadow-xl transform hover:-translate-y-1 ${
                                    isVisible.hero ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'
                                } delay-400`}
                            >
                                Join the waitlist
                            </button>
                        </div>
                    </section>

                    {/* Demo Section */}
                    <section className="px-6 lg:px-8 py-16">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex flex-col lg:flex-row items-center gap-16">
                                <div className="flex-1">
                                    <h2 className="text-3xl font-bold text-gray-900 mb-6">
                                        Learn more about Mun-e here!
                                    </h2>
                                    <div className="bg-gray-100 rounded-3xl aspect-video flex items-center justify-center relative overflow-hidden">
                                        <button className="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-105">
                                            <svg className="w-8 h-8 text-emerald-500 ml-1" fill="currentColor" viewBox="0 0 24 24">
                                                <path d="M8 5v14l11-7z"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="flex-1">
                                    <div className="bg-white rounded-3xl p-8 shadow-xl border border-gray-100 floating">
                                        <div className="bg-gray-50 rounded-2xl p-6">
                                            <div className="flex items-center justify-between mb-6">
                                                <h3 className="font-semibold">Portfolio</h3>
                                                <div className="flex items-center space-x-1 text-green-500">
                                                    <span className="text-2xl">↗</span>
                                                    <span className="font-semibold">$5.2k</span>
                                                </div>
                                            </div>
                                            
                                            <div className="text-3xl font-bold mb-4">$119,885</div>
                                            
                                            <div className="gradient-mesh h-3 rounded-full mb-6"></div>
                                            
                                            <div className="space-y-3">
                                                <div className="flex justify-between">
                                                    <span className="text-gray-600">VTI</span>
                                                    <span className="font-semibold">$48,250</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-600">VXUS</span>
                                                    <span className="font-semibold">$35,120</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-600">BND</span>
                                                    <span className="font-semibold">$36,515</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Investment Feature */}
                    <section className="px-6 lg:px-8 py-24 bg-gradient-to-r from-emerald-50 to-teal-50">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex flex-col lg:flex-row items-center gap-16">
                                <div className="flex-1">
                                    <div className="mb-8">
                                        <span className="text-4xl mb-4 block">💰</span>
                                        <h2 className="text-4xl font-bold text-gray-900 mb-6">
                                            Let Mun-e grow your money for you —{' '}
                                            <span className="text-emerald-500">automatically</span>
                                        </h2>
                                        <p className="text-xl text-gray-600">
                                            Invest smarter without lifting a finger.
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="flex-1">
                                    <div className="bg-white rounded-3xl p-6 shadow-xl border border-gray-100">
                                        <div className="bg-emerald-50 rounded-2xl p-4 mb-4">
                                            <div className="flex items-start space-x-3">
                                                <div className="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">
                                                    <span className="text-white text-sm font-bold">M</span>
                                                </div>
                                                <div className="flex-1">
                                                    <div className="bg-white rounded-2xl rounded-tl-sm p-4 shadow-sm">
                                                        <p className="text-sm font-medium">💡 Mun-e Suggests</p>
                                                        <p className="text-sm text-gray-700 mt-2">
                                                            Increasing your VTI auto-invest by $250/month can help you reach your goal 10x faster!
                                                        </p>
                                                        <button className="bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium mt-3 hover:bg-emerald-600 transition-colors">
                                                            Increase auto-invest
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <ChatBubble isUser={true}>
                                            Hey Mun-e! Increase auto-invest so I can reach my goal faster!
                                        </ChatBubble>
                                        
                                        <div className="bg-gray-50 rounded-2xl p-4">
                                            <div className="text-center">
                                                <div className="text-2xl font-bold text-gray-900">$119,885</div>
                                                <div className="text-sm text-gray-500">Total Portfolio Value</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Savings Feature */}
                    <section className="px-6 lg:px-8 py-24">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex flex-col lg:flex-row-reverse items-center gap-16">
                                <div className="flex-1">
                                    <div className="mb-8">
                                        <span className="text-4xl mb-4 block">🎯</span>
                                        <h2 className="text-4xl font-bold text-gray-900 mb-6">
                                            Smart savings that stay on track —{' '}
                                            <span className="text-emerald-500">automatically</span>
                                        </h2>
                                        <p className="text-xl text-gray-600">
                                            AI helps you hit your goals faster and adapts when life changes.
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="flex-1">
                                    <div className="bg-white rounded-3xl p-6 shadow-xl border border-gray-100">
                                        <div className="bg-emerald-50 rounded-2xl p-4 mb-4">
                                            <div className="flex items-start space-x-3">
                                                <div className="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">
                                                    <span className="text-white text-sm font-bold">M</span>
                                                </div>
                                                <div className="flex-1">
                                                    <div className="bg-white rounded-2xl rounded-tl-sm p-4 shadow-sm">
                                                        <p className="text-sm font-medium">💡 Mun-e Suggests</p>
                                                        <p className="text-sm text-gray-700 mt-2">
                                                            You're $150 ahead of schedule. Want to boost your retirement fund?
                                                        </p>
                                                        <button className="bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium mt-3 hover:bg-emerald-600 transition-colors">
                                                            Boost Goal
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="bg-gray-50 rounded-2xl p-6 mb-4">
                                            <div className="flex justify-between items-center mb-4">
                                                <h3 className="font-semibold text-gray-900">Retirement Fund 🎯</h3>
                                                <button className="bg-emerald-500 text-white px-3 py-1 rounded-full text-sm font-medium">
                                                    Boost Goal
                                                </button>
                                            </div>
                                            
                                            <div className="mb-3">
                                                <div className="flex justify-between text-sm text-gray-600 mb-2">
                                                    <span>$242,150</span>
                                                    <span>$250,000</span>
                                                </div>
                                                <div className="w-full bg-gray-200 rounded-full h-3">
                                                    <div className="bg-emerald-500 h-3 rounded-full" style={{ width: '96.86%' }}></div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <ChatBubble isUser={true}>
                                            Hey Mun-e! Transfer $100 to my retirement account.
                                        </ChatBubble>
                                        
                                        <ChatBubble>
                                            Got it! $100 has been transferred to your Retirement account. Great work! 🎉
                                        </ChatBubble>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Features Overview */}
                    <section className="px-6 lg:px-8 py-24 bg-gray-50">
                        <div className="max-w-6xl mx-auto text-center">
                            <h2 className="text-4xl font-bold text-gray-900 mb-6">
                                Explore more with Mun-e
                            </h2>
                            <p className="text-xl text-gray-600 max-w-4xl mx-auto mb-16">
                                From AI-Powered budgeting to live advisor support — Mun-e isn't just a tool, it's your financial sidekick. 
                                Whether you're tracking your credit, planning your goals, or sending money to friends, you're always in control.
                            </p>
                            
                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                                <FeatureCard
                                    icon="👥"
                                    title="Talk to a real advisor"
                                    description="Monthly subscribers can schedule 1:1s with certified financial planners."
                                    delay={0}
                                />
                                
                                <FeatureCard
                                    icon="📈"
                                    title="Credit Monitoring + Glow-Up tips"
                                    description="Get real time updates + AI and human coaching to grow your score."
                                    delay={100}
                                />
                                
                                <FeatureCard
                                    icon="📱"
                                    title="Smart budgeting tools"
                                    description="Track income, habits, and see how to optimize spending monthly."
                                    delay={200}
                                />
                                
                                <FeatureCard
                                    icon="💸"
                                    title="Send money to friends"
                                    description="Instantly move money to family or friends. No extra app needed."
                                    delay={300}
                                />
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="px-6 lg:px-8 py-12 bg-white">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex flex-col md:flex-row justify-between items-center">
                                <div className="flex items-center space-x-6 mb-6 md:mb-0">
                                    <a href="mailto:help@mun-e.com" className="text-gray-600 hover:text-gray-900 transition-colors">
                                        help@mun-e.com
                                    </a>
                                    <a href="#" className="text-gray-600 hover:text-gray-900 transition-colors">
                                        Terms of Use
                                    </a>
                                    <a href="#" className="text-gray-600 hover:text-gray-900 transition-colors">
                                        Privacy Policy
                                    </a>
                                </div>
                                <div className="text-gray-600">
                                    © 2024 Mun-e
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<MuneLandingPage />, document.getElementById('root'));
    </script>
</body>
</html>
